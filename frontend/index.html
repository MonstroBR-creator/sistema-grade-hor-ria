<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Grade Horária e Professores - CEEBJA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h1 {
      color: #004085;
      margin-top: 0;
    }
    .grid-filtros {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #e9ecef;
      padding: 15px;
      border-radius: 6px;
    }
    .campo {
      flex: 1;
      min-width: 200px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid #ced4da;
      font-size: 14px;
      background-color: white;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #dee2e6;
      text-align: left;
    }
    th {
      background-color: #004085;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f8f9fa;
    }
    .aviso {
      padding: 15px;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Grade Horária de Professores</h1>
    <p>Utilize os filtros abaixo para localizar a turma desejada:</p>

    <!-- Estrutura dos 3 Seletores -->
    <div class="grid-filtros">
      <div class="campo">
        <label for="filtro-turno">1. Turno:</label>
        <select id="filtro-turno">
          <option value="">Todos os Turnos</option>
          <option value="MANHÃ">Manhã</option>
          <option value="TARDE">Tarde</option>
          <option value="NOITE">Noite</option>
        </select>
      </div>

      <div class="campo">
        <label for="filtro-ensino">2. Ensino / Nível:</label>
        <select id="filtro-ensino">
          <option value="">Todos os Níveis</option>
          <option value="FUNDAMENTAL">Ensino Fundamental</option>
          <option value="MÉDIO">Ensino Médio</option>
        </select>
      </div>

      <div class="campo">
        <label for="select-turma">3. Turma / Módulo:</label>
        <select id="select-turma">
          <option value="">Selecione uma opção</option>
        </select>
      </div>
    </div>

    <!-- Tabela de Exibição dos Dados -->
    <div id="grade-container">
      <p class="aviso">Selecione uma turma no filtro acima para visualizar os professores e matérias.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
