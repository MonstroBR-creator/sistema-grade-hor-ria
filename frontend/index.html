<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Grade Horária — CEEBJA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-6">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 p-6">
    <div class="border-b border-slate-200 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Grade Horária e Quadro de Professores</h1>
      <p class="text-sm text-slate-500">CEEBJA / EJA — Consulta de Disciplinas e Alocações</p>
    </div>

    <!-- Único Seletor Limpo -->
    <div class="mb-6">
      <label for="select-turma" class="block text-sm font-bold text-slate-700 mb-2">Selecione a Turma / Módulo:</label>
      <select id="select-turma" class="w-full p-3 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
        <option value="">Carregando turmas...</option>
      </select>
    </div>

    <!-- Tabela Resultado -->
    <div id="resultado">
      <div class="p-6 text-center text-slate-500 bg-slate-50 rounded-lg border border-dashed border-slate-300 text-sm">
        Selecione uma turma no campo acima para visualizar as disciplinas e professores.
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
