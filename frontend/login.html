<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema — Gestão de Grade Horária</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- CONTAINER CENTRAL DE LOGIN -->
  <div class="my-auto max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
    <div class="text-center mb-8">
      <div class="bg-blue-600 text-white w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow">
        🏫
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Sistema de Grade Horária</h1>
      <p class="text-xs text-slate-500 mt-1">CEEBJA / EJA — Acesso Administrativo</p>
    </div>

    <!-- Alertas de Erro / Sucesso -->
    <div id="alerta-erro" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium"></div>
    <div id="alerta-sucesso" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-lg font-medium"></div>

    <form id="form-login" onsubmit="fazerLogin(event)" class="space-y-4">
      <div>
        <label for="identificador" class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Usuário ou CPF</label>
        <input 
          type="text" 
          id="identificador" 
          required 
          placeholder="Digite seu Usuário ou CPF"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <div>
        <label for="senha" class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Senha de Acesso</label>
        <input 
          type="password" 
          id="senha" 
          required 
          placeholder="••••••••"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <button 
        type="submit" 
        id="btn-entrar"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg text-sm shadow transition-all cursor-pointer flex justify-center items-center gap-2"
      >
        <span>Entrar no Sistema</span>
      </button>
    </form>
  </div>

  <!-- RODAPÉ INSTITUCIONAL MONSTRO TECNOLOGIAS -->
  <footer class="w-full text-center py-4 text-slate-400 text-xs space-y-1">
    <p class="font-medium text-slate-500">
      Desenvolvido por <strong class="text-slate-700">Monstro Tecnologias</strong> — CNPJ: 33.131.697/0001-99
    </p>
    <p class="text-[11px]">
      &copy; 2024–2026 Monstro Tecnologias. Todos os direitos reservados.
    </p>
  </footer>

  <!-- SCRIPT INTEGRAL DE AUTENTICAÇÃO -->
  <script>
    async function fazerLogin(event) {
      event.preventDefault();

      const identificador = document.getElementById('identificador').value.trim();
      const senha = document.getElementById('senha').value.trim();
      const alertaErro = document.getElementById('alerta-erro');
      const alertaSucesso = document.getElementById('alerta-sucesso');
      const btnEntrar = document.getElementById('btn-entrar');

      alertaErro.classList.add('hidden');
      alertaSucesso.classList.add('hidden');

      btnEntrar.disabled = true;
      btnEntrar.innerHTML = '<span>Autenticando...</span>';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identificador, senha })
        });

        const data = await response.json();

        if (response.ok && data.sucesso) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('usuario', JSON.stringify(data.usuario));

          alertaSucesso.textContent = 'Sucesso! Redirecionando...';
          alertaSucesso.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 300);

        } else {
          alertaErro.textContent = data.mensagem || 'Usuário/CPF ou senha incorretos.';
          alertaErro.classList.remove('hidden');
          btnEntrar.disabled = false;
          btnEntrar.innerHTML = '<span>Entrar no Sistema</span>';
        }
      } catch (err) {
        console.error('Erro:', err);
        alertaErro.textContent = 'Erro ao conectar ao servidor backend.';
        alertaErro.classList.remove('hidden');
        btnEntrar.disabled = false;
        btnEntrar.innerHTML = '<span>Entrar no Sistema</span>';
      }
    }
  </script>
</body>
</html>
