<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acesso ao sistema de grade horária do CEEBJA / EJA.">
  <title>Acesso ao Sistema — Gestão de Grade Horária</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">

  <!-- data-guard="publico": quem já está autenticado vai direto para a grade. -->
  <script src="js/sessao.js" data-guard="publico"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <div class="my-auto max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
    <div class="text-center mb-8">
      <div class="bg-blue-600 text-white w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl mx-auto mb-3 shadow" aria-hidden="true">
        🏫
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Sistema de Grade Horária</h1>
      <p class="text-xs text-slate-500 mt-1">CEEBJA / EJA — Acesso Administrativo</p>
    </div>

    <div id="alerta-erro" role="alert" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-lg font-medium"></div>
    <div id="alerta-sucesso" role="status" class="hidden mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-lg font-medium"></div>

    <form id="form-login" class="space-y-4" novalidate>
      <div>
        <label for="identificador" class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Usuário ou CPF</label>
        <input
          type="text"
          id="identificador"
          name="identificador"
          autocomplete="username"
          required
          placeholder="Digite seu Usuário ou CPF"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <div>
        <label for="senha" class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Senha de Acesso</label>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="current-password"
          required
          placeholder="••••••••"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
        />
      </div>

      <button
        type="submit"
        id="btn-entrar"
        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 px-4 rounded-lg text-sm shadow transition-all cursor-pointer flex justify-center items-center gap-2"
      >
        <span>Entrar no Sistema</span>
      </button>
    </form>
  </div>

  <footer class="w-full text-center py-4 text-slate-400 text-xs space-y-1">
    <p class="font-medium text-slate-500">
      Desenvolvido por <strong class="text-slate-700">RASM Tecnologia</strong> — CNPJ: 33.131.697/0001-99
    </p>
    <p class="text-[11px]">&copy; 2024–2026 RASM Tecnologia. Todos os direitos reservados.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
